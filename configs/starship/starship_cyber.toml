format = """
$os\
$sudo\
$username\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$docker_context\
$python\
$golang\
$rust\
$fill\
$nodejs\
$deno\
$package\
$terraform\
$status\
$container\
$cmd_duration\
$time
$character
"""

add_newline = false
palette = 'cyberpunk_neon'

[palettes.cyberpunk_neon]
# === BACKGROUNDS - Ambiance sombre cyberpunk ===
background = "#0B0D1E"           # Bleu nuit très sombre
black = "#080A15"                # Noir avec teinte bleue
dark_bg = "#12152A"              # Fond sombre bleuté
darker_purple = "#1A0B2E"        # Pourpre profond
darker_cyan = "#091824"          # Cyan très sombre

# === NEON PRIMAIRES - Couleurs électriques ===
neon_cyan = "#00F5FF"            # Cyan électrique
neon_purple = "#A259FF"          # Violet néon intense
neon_magenta = "#FF10F0"         # Magenta vibrant
neon_pink = "#FF0A6C"            # Rose néon
neon_blue = "#0a8dff"            # Bleu néon
neon_red = "#FF2D55"             # Rouge néon vif
neon_yellow = "#FFE030" 
neon_green = "#56f113"           # Jaune néon

# === VIOLET/PURPLE DOMINANTS ===
electric_violet = "#9945FF"      # Violet électrique principal
deep_purple = "#6B2FD6"          # Violet profond
ultra_violet = "#7B3FFF"         # Ultra violet
purple_glow = "#B366FF"          # Violet lumineux

# === BLEU DOMINANTS ===
electric_blue = "#0080FF"        # Bleu électrique
deep_blue = "#0052CC"            # Bleu profond
cyber_blue = "#00A3FF"           # Bleu cyber
ice_blue = "#33BBFF"             # Bleu glacé

# === TONS MOYENS - Contraste et lisibilité ===
medium_purple = "#8052FF"        # Violet moyen
medium_cyan = "#00D4FF"          # Cyan moyen
medium_blue = "#0091FF"          # Bleu moyen
medium_violet = "#7A2FCC"        # Violet sombre

# === VARIANTES CLAIRES ===
bright_cyan = "#5AFFFF"          # Cyan brillant
bright_purple = "#C790FF"        # Violet brillant
bright_magenta = "#FF7AFF"       # Magenta brillant
bright_blue = "#52D4FF"          # Bleu brillant
bright_violet = "#A366FF"        # Violet éclatant

# === TEXTE ===
foreground = "#E6E9FF"           # Texte principal bleuté
white = "#FFFFFF"                # Blanc pur
gray = "#6B7299"                 # Gris bleuté
dim_text = "#4A5073"             # Texte atténué

# === ACCENTS SPÉCIAUX ===
warning_yellow = "#FFD93D"       # Jaune avertissement
error_red = "#FF4757"            # Rouge erreur
success_purple = "#A259FF"       # Violet succès (au lieu du vert)
info_cyan = "#00F5FF"            # Cyan information

# === COMPATIBILITÉ LEGACY ===
blue = "#0080FF"
brightBlue = "#52D4FF"
brightCyan = "#5AFFFF"
brightGreen = "#A259FF"          # Remplacé par violet néon
brightPurple = "#C790FF"
brightRed = "#FF4757"
brightWhite = "#FFFFFF"
brightYellow = "#FFD93D"
cyan = "#00F5FF"
green = "#9945FF"                # Remplacé par violet électrique
name = "cyberpunk_neon"
purple = "#A259FF"
red = "#FF0A6C"
yellow = "#7A2FCC"               # Violet sombre pour "yellow"

continuation_prompt = "[▸▹ ](dimmed white)"

[os]
disabled = false
style = "fg:neon_pink "
format = "[$symbol]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈 "
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛 "
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"


[directory]
style = "fg:electric_blue"
format = "[  ](fg:neon_pink)[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Music" = " "
"Pictures" = " "
"Developer" = " "
"workspace" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:neon_cyan"
format = "[ $symbol](fg:neon_purple) [$branch ]($style)"

[git_status]
style = "fg:neon_magenta"
format = "[$all_status$ahead_behind ]($style)"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "󱃞 "
deleted = "✘"
renamed = "»"
modified = "!"
staged = "+"
untracked = "?"

[nodejs]
style = " fg:neon_green"
symbol = " "
format = "[ $symbol ($version) ]($style)"

[deno]
style = " fg:bright_cyan"
symbol = "nf-dev-denojs "
format = "[ $symbol ($version) ]($style)"

[python]
symbol = " "
style = " fg:neon_green"
format = "[ $symbol ($version) ]($style)"

[golang]
symbol = " "
style = " fg:bright_cyan"
format = "[ $symbol ($version) ]($style)"

[rust]
symbol = " "
style = " fg:neon_red"
format = "[ $symbol ($version) ]($style)"

[docker_context]
symbol = " "
style = "bg:medium_purple fg:neon_blue"
format = "[ $symbol ($context) ]($style)"

[time]
disabled = false
time_format = "%R"
style = "fg:neon_blue"
format = "[ ](fg:neon_yellow)[$time ]($style)"

[cmd_duration]
min_time = 2_000
format = "[ 󱦟 $duration ]($style)"
style = "fg:neon_magenta"

[fill]
symbol = " "

[line_break]
disabled = true

[character]
format = "$symbol"
success_symbol = "[❯_](bold neon_yellow)"
error_symbol = "[ ❯_](bold neon_red)"
vimcmd_symbol = "[❮](bold neon_purple)"
# not supported in zsh
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"


[username]
show_always = true
style_user = "fg:neon_purple"
style_root = "fg:neon_red"
format = '[$user]($style)'
disabled = false

[hostname]
ssh_only = true
format = '[$ssh_symbol](bold neon_blue) on [$hostname](bold neon_red) '
trim_at = '.companyname.com'
disabled = false

[git_commit]
tag_symbol = "tag: "
style = "fg:neon_cyan"


[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = '[ PICKING](fg:neon_magenta)'
rebase = '[REBASE](fg:neon_magenta)'
merge = '[ MERGE](fg:neon_magenta)'
revert = '[ REVERT](fg:neon_magenta)'
bisect = '[BISECT](fg:neon_magenta)'
disabled = false

[git_metrics]
disabled = false

[aws]
symbol = "󰸏"

[azure]
symbol = ""

[dart]
format = 'via [ $version](bold red) '

[container]
format = '[$symbol \[$name\]]($style) '

[memory_usage]
symbol = "󰍛 "

[meson]
symbol = "meson "

[package]
symbol = "󰏗 "
disabled = true
format = "[, $version]($style) "
display_private = true

[status]
symbol = "[󱖫](bold red) "

[sudo]
symbol = "󱗃 "
disabled = false

[terraform]
symbol = "󱁢 "

[localip]
ssh_only = false
format = '@[$localipv4](bold red) '
disabled = true
